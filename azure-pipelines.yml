trigger:
- main

stages:
  - stage: buildpipeline
    displayName: CIpipe
    pool: asppool
    variables:
      build configuration: "Release"
      build platform: "any cpu"
    jobs:
      - job: buildjob
        displayName: ci_job
        steps:
        - task: DotNetCoreCLI@2
          inputs:
            command: 'restore'
            projects: 'WebApplication1/WebApplication1.sln'
            feedsToUse: 'select'
        - task: DotNetCoreCLI@2
          inputs:
            command: 'build'
            projects: 'WebApplication1/WebApplication1/WebApplication1.csproj'
            arguments: '--configuration $(BuildConfiguration)'
              
        - task: DotNetCoreCLI@2
          inputs:
            command: 'publish'
            publishWebProjects: true
            arguments: '--configuration $(BuildConfiguration) --output $(BuildStagingConfiguration)'
        - task: PublishBuildArtifacts@1
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'drop'
            publishLocation: 'Container'
            
  - stage: 
    displayName: Release
    pool: asppool
    jobs:
      - deployment:
        environment: dev_may
        strategy:
          runOnce:
            deploy:
              steps:               
              - task: AzureRmWebAppDeployment@5
                inputs:
                  ConnectionType: 'AzureRM'
                  azureSubscription: 'serviceconnection05'
                  appType: 'webApp'
                  WebAppName: 'webapp05'
                  packageForLinux: '$(pipeline.workspace)/**/*.zip'
            
              
            
